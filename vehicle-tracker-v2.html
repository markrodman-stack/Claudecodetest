<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carvana Vehicle Movement Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0e1a;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid #00d4ff;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.1);
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #00d4ff;
            letter-spacing: -0.5px;
        }

        .header .subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        /* Filter Bar */
        .filter-bar {
            background: #111827;
            padding: 1.25rem 2rem;
            border-bottom: 1px solid #1e293b;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 180px;
        }

        .filter-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
        }

        select {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 0.625rem 0.875rem;
            font-size: 0.875rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        select:hover {
            border-color: #00d4ff;
            background: #252f3f;
        }

        select:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        /* KPI Summary Strip */
        .kpi-strip {
            background: #111827;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #1e293b;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .kpi-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            transition: all 0.3s ease;
        }

        .kpi-card:hover {
            border-color: #00d4ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.15);
        }

        .kpi-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        .kpi-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: #00d4ff;
            line-height: 1;
        }

        .kpi-change {
            font-size: 0.75rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .kpi-change.positive {
            color: #00e676;
        }

        .kpi-change.negative {
            color: #ff4081;
        }

        /* Main Content Area */
        .content {
            display: flex;
            height: calc(100vh - 280px);
            min-height: 600px;
        }

        .map-section {
            width: 60%;
            position: relative;
            border-right: 1px solid #1e293b;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #0a0e1a;
        }

        .ranking-section {
            width: 40%;
            overflow-y: auto;
            background: #0a0e1a;
        }

        .ranking-section::-webkit-scrollbar {
            width: 8px;
        }

        .ranking-section::-webkit-scrollbar-track {
            background: #111827;
        }

        .ranking-section::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .ranking-section::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Ranking Table */
        .ranking-header {
            background: #111827;
            padding: 1rem 1.5rem;
            border-bottom: 2px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .ranking-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #00d4ff;
        }

        .ranking-table {
            width: 100%;
        }

        .ranking-table-header {
            background: #111827;
            position: sticky;
            top: 60px;
            z-index: 9;
            border-bottom: 1px solid #1e293b;
        }

        .ranking-table-header-row {
            display: grid;
            grid-template-columns: 60px 1fr 80px 100px 80px 100px;
            padding: 0.75rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            gap: 0.75rem;
        }

        .ranking-row {
            display: grid;
            grid-template-columns: 60px 1fr 80px 100px 80px 100px;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 0.75rem;
            align-items: center;
        }

        .ranking-row:hover {
            background: #111827;
            border-left: 3px solid #00d4ff;
            padding-left: calc(1.5rem - 3px);
        }

        .rank-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
        }

        .rank-badge.gold {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #0a0e1a;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        .rank-badge.silver {
            background: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 100%);
            color: #0a0e1a;
            box-shadow: 0 4px 12px rgba(192, 192, 192, 0.3);
        }

        .rank-badge.bronze {
            background: linear-gradient(135deg, #cd7f32 0%, #e5a157 100%);
            color: #0a0e1a;
            box-shadow: 0 4px 12px rgba(205, 127, 50, 0.3);
        }

        .rank-badge.default {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }

        .location-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .location-name {
            font-weight: 600;
            color: #e2e8f0;
            font-size: 0.875rem;
        }

        .location-code {
            font-size: 0.75rem;
            color: #64748b;
        }

        .metric-value {
            font-weight: 700;
            font-size: 1.125rem;
            color: #00d4ff;
        }

        .trend-indicator {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.75rem;
        }

        .trend-arrow {
            font-size: 1rem;
        }

        .trend-arrow.up {
            color: #00e676;
        }

        .trend-arrow.down {
            color: #ff4081;
        }

        .trend-arrow.neutral {
            color: #64748b;
        }

        .sparkline {
            width: 60px;
            height: 24px;
        }

        .cost-value {
            font-weight: 600;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        /* Leaflet Dark Theme Override */
        .leaflet-container {
            background: #0a0e1a;
        }

        .leaflet-popup-content-wrapper {
            background: #111827;
            color: #e2e8f0;
            border: 1px solid #00d4ff;
            border-radius: 8px;
        }

        .leaflet-popup-tip {
            background: #111827;
        }

        .leaflet-popup-close-button {
            color: #94a3b8 !important;
        }

        .leaflet-popup-close-button:hover {
            color: #00d4ff !important;
        }

        /* Custom Marker Styles */
        .location-marker {
            background: #00d4ff;
            border: 3px solid #0a0e1a;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .location-marker.highlighted {
            width: 26px;
            height: 26px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
    </style>
</head>

function fmt(n){return n.toLocaleString()}
function getDataset(metric){return metric==='moved'?MOVES_DATA:metric==='reconditioned'?RECON_DATA:SALES_DATA}
function getWeekData(metric,week){
  const d=getDataset(metric).filter(r=>r.week===week);
  d.sort((a,b)=>b.value-a.value);
  return d.map((r,i)=>({...r,rank:i+1}));
}
function getPrevWeek(week){const i=WEEKS.indexOf(week);return i>0?WEEKS[i-1]:null}
function getRankChange(metric,code,week){
  const prev=getPrevWeek(week);
  if(!prev)return 0;
  const cur=getWeekData(metric,week),prv=getWeekData(metric,prev);
  const cr=cur.find(r=>r.code===code),pr=prv.find(r=>r.code===code);
  if(!cr||!pr)return 0;
  return pr.rank-cr.rank;
}
function getSparkline(metric,code){return WEEKS.map(w=>{const d=getDataset(metric).find(r=>r.week===w&&r.code===code);return d?d.value:0})}
function matchFilter(code,filter){
  if(filter==='all')return true;
  if(filter==='ic')return code.endsWith('-IC')&&!code.startsWith('A');
  if(filter==='recon')return code.startsWith('A')||code.includes('NNJ');
  if(filter==='hub')return code.endsWith('-HB')||code.endsWith('-LH');
  if(filter==='overflow')return code.endsWith('-OL');
  return true;
}
function drawSparkline(canvas,data){
  const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const vals=data.filter(v=>v>0);if(vals.length<2)return;
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  ctx.strokeStyle='#00d4ff';ctx.lineWidth=1.5;ctx.beginPath();
  let pts=0;
  data.forEach((v,i)=>{if(v>0){const x=i/(data.length-1)*w,y=h-((v-mn)/rng)*h*0.8-h*0.1;pts===0?ctx.moveTo(x,y):ctx.lineTo(x,y);pts++}});
  ctx.stroke();
}
const map=L.map('map',{zoomControl:true}).setView([38.5,-96],4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'OpenStreetMap CARTO',maxZoom:19}).addTo(map);
let markers=[];
function renderMap(metric,week){
  markers.forEach(m=>map.removeLayer(m));markers=[];
  const data=getWeekData(metric,week);
  const mx=data.length?data[0].value:1;
  data.forEach(r=>{
    const g=GPS[r.code];if(!g)return;
    const rad=Math.max(5,Math.min(22,Math.sqrt(r.value/mx)*22));
    const color=r.rank<=3?'#ffd700':r.rank<=10?'#00d4ff':'#7b61ff';
    const m=L.circleMarker(g,{radius:rad,fillColor:color,color:color,weight:2,opacity:0.9,fillOpacity:0.45}).addTo(map);
    m.bindPopup(`<div style="font-family:system-ui;min-width:160px"><b style="font-size:14px">${r.name}</b><br><span style="color:#888">${r.code} | Rank #${r.rank}</span><br><b style="color:#00d4ff;font-size:16px">${fmt(r.value)}</b></div>`);
    m._code=r.code;markers.push(m);
  });
}
function renderTable(metric,week,sort,filter){
  let data=getWeekData(metric,week).filter(r=>matchFilter(r.code,filter));
  if(sort==='rank-asc')data.reverse();
  if(sort==='alpha')data.sort((a,b)=>a.name.localeCompare(b.name));
  const el=document.getElementById('ranking-rows');
  el.innerHTML=data.map(r=>{
    const ch=getRankChange(metric,r.code,week);
    const badge=r.rank===1?'gold':r.rank===2?'silver':r.rank===3?'bronze':'default';
    const arrow=ch>0?`<span class="trend-arrow up">&#9650;</span><span style="color:#00e676">+${ch}</span>`:ch<0?`<span class="trend-arrow down">&#9660;</span><span style="color:#ff4081">${ch}</span>`:`<span class="trend-arrow neutral">&#9644;</span>`;
    return `<div class="ranking-row" onclick="flyTo('${r.code}')">
      <div><div class="rank-badge ${badge}">${r.rank}</div></div>
      <div class="location-info"><div class="location-name">${r.name}</div></div>
      <div class="location-code">${r.code}</div>
      <div class="metric-value">${fmt(r.value)}</div>
      <div class="trend-indicator">${arrow}</div>
      <div><canvas class="sparkline" width="60" height="24" data-code="${r.code}"></canvas></div>
    </div>`}).join('');
  el.querySelectorAll('canvas.sparkline').forEach(c=>{drawSparkline(c,getSparkline(metric,c.dataset.code))});
}
function updateKPIs(metric,week){
  const data=getWeekData(metric,week);
  const total=data.reduce((s,r)=>s+r.value,0);
  const prev=getPrevWeek(week);
  let prevTotal=0;
  if(prev){const pd=getWeekData(metric,prev);prevTotal=pd.reduce((s,r)=>s+r.value,0)}
  document.getElementById('kpi-total').textContent=fmt(total);
  document.getElementById('kpi-top').textContent=data[0]?data[0].name:'—';
  document.getElementById('kpi-top-value').textContent=data[0]?fmt(data[0].value)+' units':'';
  document.getElementById('kpi-avg').textContent=data.length?fmt(Math.round(total/data.length)):'0';
  document.getElementById('kpi-locations').textContent=data.length;
  if(prev&&prevTotal){
    const pct=((total-prevTotal)/prevTotal*100).toFixed(1);
    const cls=pct>=0?'positive':'negative';
    document.getElementById('kpi-total-change').className='kpi-change '+cls;
    document.getElementById('kpi-total-change').textContent=(pct>=0?'+':'')+pct+'% vs prev week';
  }
}
function flyTo(code){const g=GPS[code];if(!g)return;map.flyTo(g,10,{duration:1});markers.forEach(m=>{if(m._code===code)m.openPopup()})}
function applyFilters(){
  const week=document.getElementById('week-select').value;
  const metric=document.getElementById('metric-select').value;
  const filter=document.getElementById('location-type-select').value;
  const sort=document.getElementById('sort-select').value;
  renderMap(metric,week);renderTable(metric,week,sort,filter);updateKPIs(metric,week);
}
document.getElementById('week-select').addEventListener('change',applyFilters);
document.getElementById('metric-select').addEventListener('change',applyFilters);
document.getElementById('location-type-select').addEventListener('change',applyFilters);
document.getElementById('sort-select').addEventListener('change',applyFilters);
applyFilters();setTimeout(()=>map.invalidateSize(),100);
</script>
