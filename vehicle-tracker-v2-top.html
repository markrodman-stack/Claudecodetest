<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carvana Vehicle Movement Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0e1a;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid #00d4ff;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.1);
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #00d4ff;
            letter-spacing: -0.5px;
        }

        .header .subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        /* Filter Bar */
        .filter-bar {
            background: #111827;
            padding: 1.25rem 2rem;
            border-bottom: 1px solid #1e293b;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            min-width: 180px;
        }

        .filter-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
        }

        select {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 0.625rem 0.875rem;
            font-size: 0.875rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        select:hover {
            border-color: #00d4ff;
            background: #252f3f;
        }

        select:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }

        /* KPI Summary Strip */
        .kpi-strip {
            background: #111827;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #1e293b;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .kpi-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            transition: all 0.3s ease;
        }

        .kpi-card:hover {
            border-color: #00d4ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.15);
        }

        .kpi-label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        .kpi-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: #00d4ff;
            line-height: 1;
        }

        .kpi-change {
            font-size: 0.75rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .kpi-change.positive {
            color: #00e676;
        }

        .kpi-change.negative {
            color: #ff4081;
        }

        /* Main Content Area */
        .content {
            display: flex;
            height: calc(100vh - 280px);
            min-height: 600px;
        }

        .map-section {
            width: 60%;
            position: relative;
            border-right: 1px solid #1e293b;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #0a0e1a;
        }

        .ranking-section {
            width: 40%;
            overflow-y: auto;
            background: #0a0e1a;
        }

        .ranking-section::-webkit-scrollbar {
            width: 8px;
        }

        .ranking-section::-webkit-scrollbar-track {
            background: #111827;
        }

        .ranking-section::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .ranking-section::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Ranking Table */
        .ranking-header {
            background: #111827;
            padding: 1rem 1.5rem;
            border-bottom: 2px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .ranking-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #00d4ff;
        }

        .ranking-table {
            width: 100%;
        }

        .ranking-table-header {
            background: #111827;
            position: sticky;
            top: 60px;
            z-index: 9;
            border-bottom: 1px solid #1e293b;
        }

        .ranking-table-header-row {
            display: grid;
            grid-template-columns: 60px 1fr 80px 100px 80px 100px;
            padding: 0.75rem 1.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            gap: 0.75rem;
        }

        .ranking-row {
            display: grid;
            grid-template-columns: 60px 1fr 80px 100px 80px 100px;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 0.75rem;
            align-items: center;
        }

        .ranking-row:hover {
            background: #111827;
            border-left: 3px solid #00d4ff;
            padding-left: calc(1.5rem - 3px);
        }

        .rank-badge {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
        }

        .rank-badge.gold {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #0a0e1a;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        .rank-badge.silver {
            background: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 100%);
            color: #0a0e1a;
            box-shadow: 0 4px 12px rgba(192, 192, 192, 0.3);
        }

        .rank-badge.bronze {
            background: linear-gradient(135deg, #cd7f32 0%, #e5a157 100%);
            color: #0a0e1a;
            box-shadow: 0 4px 12px rgba(205, 127, 50, 0.3);
        }

        .rank-badge.default {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }

        .location-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .location-name {
            font-weight: 600;
            color: #e2e8f0;
            font-size: 0.875rem;
        }

        .location-code {
            font-size: 0.75rem;
            color: #64748b;
        }

        .metric-value {
            font-weight: 700;
            font-size: 1.125rem;
            color: #00d4ff;
        }

        .trend-indicator {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.75rem;
        }

        .trend-arrow {
            font-size: 1rem;
        }

        .trend-arrow.up {
            color: #00e676;
        }

        .trend-arrow.down {
            color: #ff4081;
        }

        .trend-arrow.neutral {
            color: #64748b;
        }

        .sparkline {
            width: 60px;
            height: 24px;
        }

        .cost-value {
            font-weight: 600;
            font-size: 0.875rem;
            color: #94a3b8;
        }

        /* Leaflet Dark Theme Override */
        .leaflet-container {
            background: #0a0e1a;
        }

        .leaflet-popup-content-wrapper {
            background: #111827;
            color: #e2e8f0;
            border: 1px solid #00d4ff;
            border-radius: 8px;
        }

        .leaflet-popup-tip {
            background: #111827;
        }

        .leaflet-popup-close-button {
            color: #94a3b8 !important;
        }

        .leaflet-popup-close-button:hover {
            color: #00d4ff !important;
        }

        /* Custom Marker Styles */
        .location-marker {
            background: #00d4ff;
            border: 3px solid #0a0e1a;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .location-marker.highlighted {
            width: 26px;
            height: 26px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>🚗 Carvana Vehicle Movement Tracker</h1>
        <div class="subtitle">Real-time location performance and logistics analytics</div>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
        <div class="filter-group">
            <label for="week-select">Week</label>
            <select id="week-select">
                <option value="2026-04-27">Apr 27 - May 3, 2026</option>
                <option value="2026-04-20">Apr 20 - Apr 26, 2026</option>
                <option value="2026-04-13">Apr 13 - Apr 19, 2026</option>
                <option value="2026-04-06">Apr 6 - Apr 12, 2026</option>
                <option value="2026-03-30">Mar 30 - Apr 5, 2026</option>
                <option value="2026-03-23">Mar 23 - Mar 29, 2026</option>
                <option value="2026-03-16">Mar 16 - Mar 22, 2026</option>
                <option value="2026-03-09">Mar 9 - Mar 15, 2026</option>
                <option value="2026-03-02">Mar 2 - Mar 8, 2026</option>
                <option value="2026-02-23">Feb 23 - Mar 1, 2026</option>
                <option value="2026-02-16">Feb 16 - Feb 22, 2026</option>
                <option value="2026-02-09">Feb 9 - Feb 15, 2026</option>
                <option value="2026-02-02">Feb 2 - Feb 8, 2026</option>
                <option value="2026-01-26">Jan 26 - Feb 1, 2026</option>
                <option value="2026-01-19">Jan 19 - Jan 25, 2026</option>
                <option value="2026-01-12">Jan 12 - Jan 18, 2026</option>
                <option value="2026-01-05">Jan 5 - Jan 11, 2026</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="metric-select">Metric</label>
            <select id="metric-select">
                <option value="moved">Units Moved</option>
                <option value="reconditioned">Units Reconditioned</option>
                <option value="sold">Units Sold</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="location-type-select">Location Type</label>
            <select id="location-type-select">
                <option value="all">All Locations</option>
                <option value="ic">ICs Only</option>
                <option value="recon">Recon Centers</option>
                <option value="hub">Hubs</option>
                <option value="overflow">Overflow Lots</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="sort-select">Sort By</label>
            <select id="sort-select">
                <option value="rank-desc">Rank (Highest First)</option>
                <option value="rank-asc">Rank (Lowest First)</option>
                <option value="alpha">Alphabetical</option>
            </select>
        </div>
    </div>

    <!-- KPI Summary Strip -->
    <div class="kpi-strip">
        <div class="kpi-card">
            <div class="kpi-label">Total Units This Week</div>
            <div class="kpi-value" id="kpi-total">0</div>
            <div class="kpi-change" id="kpi-total-change"></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Top Performer</div>
            <div class="kpi-value" id="kpi-top">—</div>
            <div class="kpi-change" id="kpi-top-value"></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Average Per Location</div>
            <div class="kpi-value" id="kpi-avg">0</div>
            <div class="kpi-change" id="kpi-avg-change"></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Active Locations</div>
            <div class="kpi-value" id="kpi-locations">0</div>
            <div class="kpi-change" id="kpi-locations-change"></div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="content">
        <!-- Map Section (Left 60%) -->
        <div class="map-section">
            <div id="map"></div>
        </div>

        <!-- Ranking Section (Right 40%) -->
        <div class="ranking-section">
            <div class="ranking-header">
                <h2>Location Rankings</h2>
            </div>
            <div class="ranking-table">
                <div class="ranking-table-header">
                    <div class="ranking-table-header-row">
                        <div>Rank</div>
                        <div>Location</div>
                        <div>Code</div>
                        <div>Value</div>
                        <div>Trend</div>
                        <div>Avg Cost</div>
                    </div>
                </div>
                <div id="ranking-rows">
                    <!-- Ranking rows will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>

<script>
